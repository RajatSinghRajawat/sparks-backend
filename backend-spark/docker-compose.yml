services:
  # ─── Express Backend API ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduspark-backend-api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/eduspark
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - eduspark-network

  # ─── MongoDB Database ───
  mongo:
    image: mongo:7.0
    container_name: eduspark-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - eduspark-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Nginx Reverse Proxy & Auto Certbot SSL ───
  nginx:
    image: jonasal/nginx-certbot:latest
    container_name: eduspark-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CERTBOT_EMAIL=santoshkumarsharma9597@gmail.com
    volumes:
      - ./nginx.conf:/etc/nginx/user_conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - api
    networks:
      - eduspark-network

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  certbot_certs:
    driver: local

networks:
  eduspark-network:
    driver: bridge
